version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: razorpay-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: razorpay_recovery
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d razorpay_recovery"]
      interval: 10s
      timeout: 5s
      retries: 5

  recovery-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: razorpay-recovery-agent
    ports:
      - "8080:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/razorpay_recovery
      - ASYNC_DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/razorpay_recovery
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-mock}
      - MAX_RETRY_ATTEMPTS=3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./agent:/app/agent
      - ./api_integration:/app/api_integration
      - ./ml:/app/ml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
