[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "razorpay-revenue-recovery-agent"
version = "0.1.0"
description = "Autonomous AI Revenue Recovery Engine for Razorpay Hackathon Track 03"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shrihan" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "razorpay>=1.4.1",
    "openai>=1.14.0",
    "anthropic>=0.19.0",
    "google-generativeai>=0.4.1",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "scikit-learn>=1.4.1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "xgboost>=2.0.3",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
